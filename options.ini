[generic]
language = en-US
judgelanguage = english

[window]
fullscreenmode = 0          ; 0 for windowed, 1 for borderless, 2 for exclusive
; for windowed
windowwidth = 720
windowheight = 720
; for exclusive, use 0 for no preference
exclusivewidth = 0
exclusiveheight = 0
exclusivehz = 0

[graphics]
vsync = 1                         ; -1 for adaptive vsync 0 for vsync off, 1 for vsync on, 2+ to update every # refresh
ingamevsync = 0       	          ; same as above but only in gameplay
rotateby = 0                      ; 0 for nothing, 90, 180, or 270 to rotate the whole screen by that amount (decreases performance)

[video]
enablemovie = 1                             ; 0 to always use background image, 1 to try to use video background
framebuffersize = 8                         ; range is from 2 to 32 (default is 8)

[audio]
machinemastervolume = 0.5          ; range is 0.0 to 1.0

[game]
usesubscreen = 0                          ; use if you have a controller, shows info at the top of screen
enablerating = 1                          ; enable to allow calculating rating from your scores (NOTE: make SURE you trust the chart's levels before enabling!)
enablebginsongselect = 1                  ; disable to not show background next to title in song select to save vram and loading times

[controller]
enablecontroller = 0                ; 0 for standard touchscreen, 1 to enable controller
enablelights = 1                    ; for controller, enables or disables button lights
player = 1                          ; either 1 or 2, changes which keys is detected
buttondebouncedelay = 0.014         ; note: 0.014 is default but may not be optimal/correct for YOUR controller

usecustomcontrollerports = 0 ; 0 to use defaults or 1 to use ports listed below

; make sure that the ports specified here is the same as listed in device manager (/dev if on linux)
controllertouchport = COM3     ; default is COM3 (/dev/ttyACM0 on linux)
controllerlightsport = COM21    ; default is COM21 (/dev/ttyUSB0 on linux)